name: Daily Quote

on:
  workflow_dispatch:            # 手动触发（Actions 页面点 Run workflow）
  schedule:
    - cron: '0 12 * * *'        # 每天 UTC 12:00 = 北京时间 20:00（已收盘）

permissions:
  contents: write               # 允许推送数据到仓库

concurrency:
  group: daily-quote
  cancel-in-progress: false     # 防止两次运行撞车

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出仓库（用 GH_TOKEN，后面才能 push）
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ① 修补脚本（保留你原有的两个修复步骤，缺文件自动跳过）
        run: |
          if [ -f scripts/fix_record_truth.py ]; then python scripts/fix_record_truth.py; else echo "无 fix_record_truth.py，跳过"; fi
          if [ -f scripts/fix_backtest_stats.py ]; then python scripts/fix_backtest_stats.py; else echo "无 fix_backtest_stats.py，跳过"; fi

      - name: ② 拉取行情（日线 + 1分钟，北交所已全程过滤）
        run: python scripts/fetch_quotes.py

      - name: ③ 真假量柱账本（分析 → 写账本 → 删除原始1分钟数据）
        run: python scripts/record_truth.py

      - name: ④ 阈值体检（仅每月1日运行，避免报告天天产生 diff）
        run: |
          if [ "$(date -u +'%d')" = "01" ]; then
            python scripts/recalibrate_thresholds.py --sweep --top 10 \
              --json data/analysis/threshold_report.json
          else
            echo "今天不是每月1日，跳过阈值体检"
          fi

      - name: ⑤ 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "daily: $(date -u +'%Y-%m-%d') 数据管道"
            git push
          fi
