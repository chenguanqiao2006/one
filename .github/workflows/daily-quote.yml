name: Daily Quote Pipeline

# 同一时间只允许一个运行实例：新运行会自动取消还在跑的旧实例（防撞车修复）
concurrency:
  group: daily-quote
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 12 * * *'   # UTC 12:00 = 北京时间 20:00
  workflow_dispatch:        # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install requests akshare

      - name: 运行修复脚本（如存在）
        run: |
          if [ -f scripts/fix_record_truth.py ]; then python scripts/fix_record_truth.py; else echo "无 fix_record_truth.py，跳过"; fi
          if [ -f scripts/fix_backtest_stats.py ]; then python scripts/fix_backtest_stats.py; else echo "无 fix_backtest_stats.py，跳过"; fi

      - name: 拉取行情（日线 + 1分钟）
        run: python scripts/fetch_quotes.py

      - name: 记录真假量柱账本
        run: python scripts/record_truth.py

      - name: 每月1日阈值体检
        run: |
          if [ "$(date -u +'%d')" = "01" ]; then
            python scripts/recalibrate_thresholds.py --sweep --top 10 \
              --json data/analysis/threshold_report.json
          else
            echo "今天不是每月1日，跳过阈值体检"
          fi

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "daily: $(date -u +'%Y-%m-%d') 数据管道"
            git pull --rebase --autostash origin main
            git push
          fi
